name: Shell checks

on:
  push:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/shell-checks.yml
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/shell-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Bash and AppArmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apparmor openssh-client shellcheck
      - name: Check shell syntax and lint
        run: |
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
          shellcheck scripts/*.sh tests/*.sh
      - name: Run isolated regression checks
        run: |
          command -v apparmor_parser
          bash tests/setup-codex-ssh.test.sh
          bash tests/install-hercules.test.sh
          bash tests/configure-tnftp-apparmor.test.sh
