name: Shell checks

on:
  push:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/shell-checks.yml
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/shell-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Bash and AppArmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apparmor openssh-client
      - name: Install ShellCheck 0.11.0
        run: |
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$archive"
          printf '%s  %s\n' '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" /usr/local/bin/shellcheck
      - name: Check shell syntax and lint
        run: |
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
          shellcheck scripts/*.sh tests/*.sh
      - name: Run isolated regression checks
        run: |
          command -v apparmor_parser
          bash tests/setup-codex-ssh.test.sh
          bash tests/install-hercules.test.sh
          bash tests/configure-tnftp-apparmor.test.sh
